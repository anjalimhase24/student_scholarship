<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Smart Student Support</title>

<style>
:root {
  --primary: #0f0f0f;
  --secondary: #161617;
  --bg: #f4f7fb;
  --white: #ffffff;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.navbar {
  background: #111;
  color: #fff;
  padding: 18px 50px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 1000;
}

.navbar .logo {
  font-size: 24px;
  font-weight: 700;
}

.navbar ul {
  display: flex;
  list-style: none;
  gap: 25px;
}

.navbar a {
  text-decoration: none;
  color: #fff;
  font-weight: 500;
  transition: 0.3s;
}

.navbar a:hover,
.navbar a.active {
  color: #ffd700;
}


.wrapper {
  width: 420px;
  background: var(--white);
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 0 12px rgba(0,0,0,0.12);
  margin: 90px auto;
}

h2 {
  text-align: center;
}

input {
  width: 100%;
  padding: 13px;
  margin: 12px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 13px;
  border: none;
  background: var(--secondary);
  color: white;
  font-size: 17px;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  background: var(--primary);
}

.msg {
  text-align: center;
  margin-top: 10px;
  font-weight: bold;
}

footer {
  background: var(--primary);
  color: white;
  text-align: center;
  padding: 12px;
  margin-top: auto;
}
</style>
</head>
<body>

<header class="navbar">
  <div class="logo">SmartSupport</div>
  <nav>
    <ul>
      <li><a class="active" href="../index.html">Home</a></li>
      <li><a href="../pages/scholarship.html">Scholarships</a></li>
      <li><a href="../pages/register.html">Register</a></li>
      <li><a href="../pages/login.html">Login</a></li>
    </ul>
  </nav>
</header>

<div class="wrapper">
  <h2>Login</h2>

  <form id="loginForm">
    <input type="email" id="email" placeholder="Enter Email" required>
    <input type="password" id="password" placeholder="Enter Password" required>
    <button type="submit">Login</button>
  </form>

  <div class="msg" id="message"></div>
</div>

<footer>
  © 2025 Smart Student Support — Maharashtra Scholarships Portal
</footer>

<script>
// 🔹 First time default user save (acts like database)
if (!localStorage.getItem("users")) {
  const defaultUsers = [
    { email: "student@gmail.com", password: "12345" },
    { email: "admin@gmail.com", password: "admin123" }
  ];
  localStorage.setItem("users", JSON.stringify(defaultUsers));
}

// 🔹 Login System using JS Database (LocalStorage)
document.getElementById("loginForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  // Get users from LocalStorage (database)
  const users = JSON.parse(localStorage.getItem("users")) || [];

  // Check login
  const validUser = users.find(user => 
    user.email === email && user.password === password
  );

  if (validUser) {
    message.style.color = "green";
    message.innerText = "Login Successful 🎉";
    
    // Save current logged user
    localStorage.setItem("currentUser", email);

    // Redirect (optional)
    setTimeout(() => {
      window.location.href = "dashboard.html";
    }, 1500);

  } else {
    message.style.color = "red";
    message.innerText = "Invalid Email or Password ❌";
  }
});
</script>

</body>
</html>
